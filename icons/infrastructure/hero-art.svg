<svg xmlns="http://www.w3.org/2000/svg" class="ill" viewBox="0 0 640 480">
    <defs>
        <style>
            :root {
                --ill-sky: #f6e7d3;
                --ill-sky-2: #fbf1e4;
                --ill-sun: #e3735a;
                --ill-sun-2: #f5c46e;
                --ill-sea: #1a528f;
                --ill-sea-2: #6ba4d9;
                --ill-sea-3: #b8d7f2;
                --ill-sand: #e8dcb8;
                --ill-ink: #002244;
                --ill-ink-2: #003366;
                --ill-ink-3: #1a4f80;
                --ill-gold: #c29a57;
                --ill-coral: #c95a41;
                --ill-glass: #d6e6f5;
                --ill-white: #fffdf9;
                --ill-line: rgba(0, 34, 68, 0.18);
            }
            .f-sky { fill: var(--ill-sky, #f6e7d3); }
            .f-sun { fill: var(--ill-sun, #e3735a); }
            .f-sun2 { fill: var(--ill-sun-2, #f5c46e); }
            .f-sea { fill: var(--ill-sea, #1a528f); }
            .f-sea2 { fill: var(--ill-sea-2, #6ba4d9); }
            .f-sea3 { fill: var(--ill-sea-3, #b8d7f2); }
            .f-sand { fill: var(--ill-sand, #e8dcb8); }
            .f-ink { fill: var(--ill-ink, #002244); }
            .f-ink2 { fill: var(--ill-ink-2, #003366); }
            .f-ink3 { fill: var(--ill-ink-3, #1a4f80); }
            .f-gold { fill: var(--ill-gold, #c29a57); }
            .f-coral { fill: var(--ill-coral, #c95a41); }
            .f-glass { fill: var(--ill-glass, #d6e6f5); }
            .f-white { fill: var(--ill-white, #fffdf9); }
            .k-ink { fill: none; stroke: var(--ill-ink, #002244); }
            .k-ink2 { fill: none; stroke: var(--ill-ink-2, #003366); }
            .k-gold { fill: none; stroke: var(--ill-gold, #c29a57); }
            .k-coral { fill: none; stroke: var(--ill-coral, #c95a41); }
            .k-white { fill: none; stroke: var(--ill-white, #fffdf9); }
            .k-line { fill: none; stroke: var(--ill-line, rgba(0, 34, 68, 0.18)); }
            .spin { transform-box: fill-box; transform-origin: center; animation: illSpin 6s linear infinite; }
            .spin.slow { animation-duration: 12s; }
            .bob { animation: illBob 5s ease-in-out infinite; }
            .drift { animation: illDrift 14s ease-in-out infinite alternate; }
            .twinkle { animation: illTwinkle 3.2s ease-in-out infinite; }
            .twinkle:nth-of-type(2n) { animation-delay: 1.1s; }
            .twinkle:nth-of-type(3n) { animation-delay: 2s; }
            @keyframes illSpin { to { transform: rotate(360deg); } }
            @keyframes illBob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
            @keyframes illDrift { from { transform: translateX(-18px); } to { transform: translateX(18px); } }
            @keyframes illTwinkle { 0%, 100% { opacity: 0.95; } 50% { opacity: 0.25; } }
            @media (prefers-reduced-motion: reduce) {
                .spin, .bob, .drift, .twinkle, animateMotion { animation: none !important; }
            }
        </style>
        <clipPath id="ih-clip">
                            <rect width="640" height="480" rx="40" />
                        </clipPath>
                        <linearGradient id="ih-sky" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0" stop-color="#fbf1e4" style="stop-color:var(--ill-sky-2, #fbf1e4)" />
                            <stop offset="1" stop-color="#f6e7d3" style="stop-color:var(--ill-sky, #f6e7d3)" />
                        </linearGradient>
                        <linearGradient id="ih-sea" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0" stop-color="#6ba4d9" style="stop-color:var(--ill-sea-2, #6ba4d9)" />
                            <stop offset="1" stop-color="#1a528f" style="stop-color:var(--ill-sea, #1a528f)" />
                        </linearGradient>
    </defs>
