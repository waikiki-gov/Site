<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" fill="none" style="color: #003366;">
  <defs>
    <linearGradient id="b747Body" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="currentColor" stop-opacity="0.12" />
      <stop offset="50%" stop-color="currentColor" stop-opacity="0.28" />
      <stop offset="100%" stop-color="currentColor" stop-opacity="0.12" />
    </linearGradient>
    <linearGradient id="b747Wing" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="currentColor" stop-opacity="0.22" />
      <stop offset="100%" stop-color="currentColor" stop-opacity="0.08" />
    </linearGradient>
  </defs>

  <!-- Technical Axis and Grid -->
  <g opacity="0.25" stroke="currentColor" stroke-width="0.75" stroke-dasharray="3 3">
    <line x1="400" y1="30" x2="400" y2="770" />
    <line x1="60" y1="520" x2="740" y2="520" />
    <circle cx="400" cy="410" r="340" />
    <circle cx="400" cy="410" r="180" />
  </g>

  <!-- Dimensions Callouts -->
  <g opacity="0.55" stroke="currentColor" stroke-width="1">
    <!-- Wingspan 68m bar -->
    <line x1="65" y1="510" x2="65" y2="480" />
    <line x1="735" y1="510" x2="735" y2="480" />
    <line x1="65" y1="495" x2="735" y2="495" stroke-dasharray="4 4" />
    <!-- Length 76m bar -->
    <line x1="370" y1="55" x2="340" y2="55" />
    <line x1="370" y1="735" x2="340" y2="735" />
    <line x1="355" y1="55" x2="355" y2="735" stroke-dasharray="4 4" />
  </g>
  <text x="400" y="488" text-anchor="middle" fill="currentColor" font-family="monospace" font-size="11" letter-spacing="2" opacity="0.75">SPAN 68.4 M</text>
  <text x="340" y="390" text-anchor="middle" fill="currentColor" font-family="monospace" font-size="11" letter-spacing="2" opacity="0.75" transform="rotate(-90 340 390)">LENGTH 76.3 M</text>

  <!-- Left Wing (37.5° sweep, raked wingtip) -->
  <path d="M 372 310 L 65 520 L 70 538 L 160 505 L 260 472 L 340 450 L 372 485 Z" fill="url(#b747Wing)" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" />
  <!-- Right Wing -->
  <path d="M 428 310 L 735 520 L 730 538 L 640 505 L 540 472 L 460 450 L 428 485 Z" fill="url(#b747Wing)" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" />

  <!-- Raked Wingtips -->
  <path d="M 65 520 L 52 505 L 70 538 Z" fill="currentColor" opacity="0.6" />
  <path d="M 735 520 L 748 505 L 730 538 Z" fill="currentColor" opacity="0.6" />

  <!-- Wing Details and Flap Track Fairings Left -->
  <g stroke="currentColor" stroke-width="1" opacity="0.65">
    <line x1="115" y1="518" x2="195" y2="485" />
    <line x1="205" y1="480" x2="285" y2="447" />
    <line x1="295" y1="442" x2="355" y2="415" />
    <!-- Flap canoes -->
    <line x1="160" y1="505" x2="155" y2="525" stroke-width="2.2" />
    <line x1="230" y1="482" x2="225" y2="502" stroke-width="2.2" />
    <line x1="300" y1="460" x2="295" y2="480" stroke-width="2.2" />
  </g>
  <!-- Wing Details and Flap Track Fairings Right -->
  <g stroke="currentColor" stroke-width="1" opacity="0.65">
    <line x1="685" y1="518" x2="605" y2="485" />
    <line x1="595" y1="480" x2="515" y2="447" />
    <line x1="505" y1="442" x2="445" y2="415" />
    <!-- Flap canoes -->
    <line x1="640" y1="505" x2="645" y2="525" stroke-width="2.2" />
    <line x1="570" y1="482" x2="575" y2="502" stroke-width="2.2" />
    <line x1="500" y1="460" x2="505" y2="480" stroke-width="2.2" />
  </g>

  <!-- 4 GEnx-2B67 Engines (with serrated chevrons on exhausts) -->
  <!-- Left Outboard Engine (E1) -->
  <g stroke="currentColor" stroke-width="1.8" fill="currentColor" fill-opacity="0.35">
    <rect x="175" y="470" width="20" height="52" rx="8" />
    <line x1="185" y1="470" x2="185" y2="440" stroke-width="2.2" />
    <circle cx="185" cy="478" r="3.5" fill="currentColor" />
    <!-- Chevrons -->
    <path d="M 178 522 L 185 528 L 192 522" stroke-width="1.2" fill="none" />
  </g>
  <!-- Left Inboard Engine (E2) -->
  <g stroke="currentColor" stroke-width="1.8" fill="currentColor" fill-opacity="0.35">
    <rect x="282" y="415" width="23" height="58" rx="9" />
    <line x1="293" y1="415" x2="293" y2="375" stroke-width="2.4" />
    <circle cx="293" cy="423" r="4" fill="currentColor" />
    <path d="M 285 473 L 293 480 L 301 473" stroke-width="1.2" fill="none" />
  </g>
  <!-- Right Inboard Engine (E3) -->
  <g stroke="currentColor" stroke-width="1.8" fill="currentColor" fill-opacity="0.35">
    <rect x="495" y="415" width="23" height="58" rx="9" />
    <line x1="507" y1="415" x2="507" y2="375" stroke-width="2.4" />
    <circle cx="507" cy="423" r="4" fill="currentColor" />
    <path d="M 499 473 L 507 480 L 515 473" stroke-width="1.2" fill="none" />
  </g>
  <!-- Right Outboard Engine (E4) -->
  <g stroke="currentColor" stroke-width="1.8" fill="currentColor" fill-opacity="0.35">
    <rect x="605" y="470" width="20" height="52" rx="8" />
    <line x1="615" y1="470" x2="615" y2="440" stroke-width="2.2" />
    <circle cx="615" cy="478" r="3.5" fill="currentColor" />
    <path d="M 608 522 L 615 528 L 622 522" stroke-width="1.2" fill="none" />
  </g>

  <!-- Horizontal Stabilizers (Tail) -->
  <path d="M 386 645 L 265 725 L 270 742 L 345 722 L 386 705 Z" fill="url(#b747Wing)" stroke="currentColor" stroke-width="2" stroke-linejoin="round" />
  <path d="M 414 645 L 535 725 L 530 742 L 455 722 L 414 705 Z" fill="url(#b747Wing)" stroke="currentColor" stroke-width="2" stroke-linejoin="round" />

  <!-- Fuselage Body with Iconic 747 Hump -->
  <path d="M 400 55 C 388 75 372 120 372 180 L 372 630 C 372 680 384 715 400 735 C 416 715 428 680 428 630 L 428 180 C 428 120 412 75 400 55 Z" fill="url(#b747Body)" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" />

  <!-- Upper Deck Hump Outline (Signature 747 feature extending to Y=320) -->
  <path d="M 380 90 C 380 75 420 75 420 90 L 420 310 C 420 330 380 330 380 310 Z" stroke="currentColor" stroke-width="1.5" fill="currentColor" fill-opacity="0.1" />

  <!-- Cockpit Windows -->
  <path d="M 388 88 C 394 82 406 82 412 88 L 416 98 L 384 98 Z" fill="currentColor" opacity="0.85" />
  <line x1="400" y1="83" x2="400" y2="98" stroke="currentColor" stroke-width="1.2" />

  <!-- Panel Lines and Vertical Fin -->
  <g stroke="currentColor" stroke-width="1" opacity="0.55">
    <line x1="373" y1="190" x2="427" y2="190" />
    <line x1="373" y1="260" x2="427" y2="260" />
    <line x1="373" y1="330" x2="427" y2="330" />
    <line x1="373" y1="410" x2="427" y2="410" />
    <line x1="373" y1="490" x2="427" y2="490" />
    <line x1="373" y1="570" x2="427" y2="570" />
    <!-- Vertical tail spine -->
    <line x1="400" y1="580" x2="400" y2="725" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Aircraft ID watermark -->
  <text x="400" y="770" text-anchor="middle" fill="currentColor" font-family="monospace" font-size="9" font-weight="bold" letter-spacing="3" opacity="0.7">BOEING 747-8I · AIR FORCE II and III</text>
</svg>