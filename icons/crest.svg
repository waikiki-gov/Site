<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="Royal Coat of Arms of the Sovereign Realm of Waikiki">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3df9e"/>
      <stop offset="48%" stop-color="#c8a24a"/>
      <stop offset="100%" stop-color="#8b661b"/>
    </linearGradient>
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f7e7b4"/>
      <stop offset="100%" stop-color="#c8a24a"/>
    </linearGradient>
    <linearGradient id="goldShadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b58c34"/>
      <stop offset="100%" stop-color="#765314"/>
    </linearGradient>
    <radialGradient id="navyBg" cx="50%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#1a2d52"/>
      <stop offset="65%" stop-color="#0c1426"/>
      <stop offset="100%" stop-color="#070c17"/>
    </radialGradient>
    <linearGradient id="tealSea" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00b7c6"/>
      <stop offset="100%" stop-color="#0b6e7c"/>
    </linearGradient>
    <clipPath id="medallionClip">
      <circle cx="120" cy="120" r="76"/>
    </clipPath>
  </defs>

  <!-- Outer Golden Laurel Wreath -->
  <g fill="url(#goldGrad)" stroke="#7f5b17" stroke-width="0.6">
    <!-- Left stem -->
    <path d="M 116 210 C 66 205, 28 168, 28 118 C 28 76, 54 42, 92 28" fill="none" stroke="url(#goldGrad)" stroke-width="3.2" stroke-linecap="round"/>
    <!-- Right stem -->
    <path d="M 124 210 C 174 205, 212 168, 212 118 C 212 76, 186 42, 148 28" fill="none" stroke="url(#goldGrad)" stroke-width="3.2" stroke-linecap="round"/>

    <!-- Left wreath leaves -->
    <g id="leftLeaves">
      <ellipse cx="77" cy="36" rx="10" ry="4.2" transform="rotate(-24 77 36)"/>
      <ellipse cx="90" cy="36" rx="8.5" ry="3.6" transform="rotate(24 90 36)"/>
      <ellipse cx="56" cy="52" rx="11" ry="4.4" transform="rotate(-44 56 52)"/>
      <ellipse cx="69" cy="54" rx="9" ry="3.8" transform="rotate(6 69 54)"/>
      <ellipse cx="39" cy="74" rx="11.5" ry="4.5" transform="rotate(-62 39 74)"/>
      <ellipse cx="52" cy="78" rx="9.5" ry="3.8" transform="rotate(-14 52 78)"/>
      <ellipse cx="29" cy="100" rx="11.5" ry="4.6" transform="rotate(-78 29 100)"/>
      <ellipse cx="42" cy="104" rx="9.5" ry="3.8" transform="rotate(-32 42 104)"/>
      <ellipse cx="27" cy="128" rx="11.5" ry="4.6" transform="rotate(-96 27 128)"/>
      <ellipse cx="40" cy="130" rx="9.5" ry="3.8" transform="rotate(-50 40 130)"/>
      <ellipse cx="34" cy="156" rx="11.5" ry="4.5" transform="rotate(-116 34 156)"/>
      <ellipse cx="47" cy="155" rx="9.5" ry="3.8" transform="rotate(-70 47 155)"/>
      <ellipse cx="50" cy="180" rx="11" ry="4.4" transform="rotate(-136 50 180)"/>
      <ellipse cx="62" cy="176" rx="9" ry="3.8" transform="rotate(-92 62 176)"/>
      <ellipse cx="74" cy="198" rx="10.5" ry="4.2" transform="rotate(-154 74 198)"/>
      <ellipse cx="86" cy="192" rx="9" ry="3.6" transform="rotate(-114 86 192)"/>
      <ellipse cx="101" cy="208" rx="9.5" ry="4" transform="rotate(-172 101 208)"/>
    </g>
    <!-- Right wreath leaves (mirrored) -->
    <g transform="translate(240, 0) scale(-1, 1)">
      <use href="#leftLeaves"/>
    </g>
  </g>

  <!-- Crown Star at Top -->
  <polygon points="120,12 124.2,23.5 136.5,23.8 126.7,31.2 130.2,43 120,36 109.8,43 113.3,31.2 103.5,23.8 115.8,23.5" fill="url(#goldGrad)" stroke="#7f5b17" stroke-width="0.8"/>

  <!-- Bottom Ribbon Knot -->
  <path d="M 106 207 Q 120 218 134 207 L 130 220 Q 120 215 110 220 Z" fill="url(#goldGrad)" stroke="#7f5b17" stroke-width="0.8"/>
  <circle cx="120" cy="211" r="4.8" fill="#f3df9e" stroke="#7f5b17" stroke-width="0.9"/>

  <!-- Central Royal Medallion -->
  <circle cx="120" cy="120" r="82" fill="url(#goldGrad)"/>
  <circle cx="120" cy="120" r="78.5" fill="#0c1426"/>
  <circle cx="120" cy="120" r="76" fill="url(#navyBg)"/>

  <!-- Scene inside medallion -->
  <g clip-path="url(#medallionClip)">
    <!-- Subtle sunlit halo behind central pyramid -->
    <circle cx="120" cy="94" r="34" fill="#e7cb82" opacity="0.16"/>
    <circle cx="120" cy="94" r="20" fill="#f3df9e" opacity="0.24"/>

    <!-- Radiating sun rays -->
    <g stroke="#e7cb82" stroke-width="1.3" opacity="0.45">
      <line x1="120" y1="54" x2="120" y2="66"/>
      <line x1="94" y1="62" x2="101" y2="71"/>
      <line x1="146" y1="62" x2="139" y2="71"/>
      <line x1="76" y1="80" x2="87" y2="85"/>
      <line x1="164" y1="80" x2="153" y2="85"/>
    </g>

    <!-- Left Sovereign Pyramid -->
    <polygon points="84,96 50,152 84,152" fill="url(#goldLight)"/>
    <polygon points="84,96 84,152 108,152" fill="url(#goldShadow)"/>

    <!-- Right Sovereign Pyramid -->
    <polygon points="156,96 132,152 156,152" fill="url(#goldLight)"/>
    <polygon points="156,96 156,152 190,152" fill="url(#goldShadow)"/>

    <!-- Central Grand Mega-Pyramid -->
    <polygon points="120,66 78,152 120,152" fill="url(#goldLight)"/>
    <polygon points="120,66 120,152 162,152" fill="url(#goldShadow)"/>
    <polyline points="78,152 120,66 162,152" fill="none" stroke="#f7e7b4" stroke-width="1.2"/>

    <!-- Caribbean Sea & Golden Horizon -->
    <rect x="40" y="150" width="160" height="52" fill="url(#tealSea)"/>
    <line x1="40" y1="150.5" x2="200" y2="150.5" stroke="#f3df9e" stroke-width="2"/>
    <!-- Stylized Waves -->
    <path d="M 46 163 Q 66 157 86 163 T 126 163 T 166 163 T 206 163" fill="none" stroke="#f3df9e" stroke-width="2" opacity="0.82"/>
    <path d="M 42 174 Q 62 168 82 174 T 122 174 T 162 174 T 202 174" fill="none" stroke="#e7cb82" stroke-width="1.6" opacity="0.62"/>
    <path d="M 52 184 Q 72 179 92 184 T 132 184 T 172 184" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.45"/>
  </g>

  <!-- Inner gold ring -->
  <circle cx="120" cy="120" r="76" fill="none" stroke="url(#goldGrad)" stroke-width="2.2"/>
</svg>
